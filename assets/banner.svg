<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F05032" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.22) translate(-30px, 20px); opacity: 0.55; }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatCommit {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCommitAlt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 250px 180px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 950px 180px; }
    .git-branch-main { stroke: #F05032; stroke-width: 3.5; stroke-dasharray: 8 6; animation: dashLine 4s linear infinite; }
    .git-branch-feature { stroke: #38BDF8; stroke-width: 3; stroke-dasharray: 6 6; animation: dashLine 5s linear infinite; }
    .git-branch-merge { stroke: #8B5CF6; stroke-width: 3; stroke-dasharray: 7 5; animation: dashLine 6s linear infinite; }
    
    .commit-node-1 { animation: floatCommit 4s ease-in-out infinite; }
    .commit-node-2 { animation: floatCommitAlt 5s ease-in-out infinite; }
    .commit-node-3 { animation: floatCommit 4.5s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Dark Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay in background -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing Dynamic Background Lights (Kept behind foreground text) -->
  <g>
    <circle class="orb-1" cx="220" cy="180" r="150" fill="#F05032" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="170" r="170" fill="#6366F1" filter="url(#glow)" />
    <circle cx="600" cy="190" r="130" fill="#EC4899" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Dynamic Git Flow Graph Simulation (In Midground & Edges, safely framed) -->
  <g opacity="0.6">
    <!-- Branch Line 1 (Main/Master) -->
    <path d="M 50 70 C 200 70, 260 70, 420 70 C 580 70, 720 70, 1150 70" fill="none" class="git-branch-main" />
    
    <!-- Branch Line 2 (Feature branch branching off and re-joining) -->
    <path d="M 120 70 C 180 70, 220 120, 320 120 C 440 120, 520 120, 600 120 C 680 120, 720 70, 780 70" fill="none" class="git-branch-feature" />
    
    <!-- Branch Line 3 (Bottom Flow) -->
    <path d="M 60 290 C 220 290, 340 290, 500 290 C 650 290, 750 240, 880 240 C 980 240, 1060 290, 1140 290" fill="none" class="git-branch-merge" />

    <!-- Animated Nodes along paths -->
    <g class="commit-node-1">
      <circle cx="220" cy="70" r="9" fill="#0e172a" stroke="#F05032" stroke-width="3" filter="url(#subtleGlow)"/>
      <circle cx="220" cy="70" r="4" fill="#F05032" />
    </g>
    <g class="commit-node-2">
      <circle cx="450" cy="120" r="9" fill="#0e172a" stroke="#38BDF8" stroke-width="3" filter="url(#subtleGlow)"/>
      <circle cx="450" cy="120" r="4" fill="#38BDF8" />
    </g>
    <g class="commit-node-3">
      <circle cx="780" cy="70" r="9" fill="#0e172a" stroke="#8B5CF6" stroke-width="3" filter="url(#subtleGlow)"/>
      <circle cx="780" cy="70" r="4" fill="#8B5CF6" />
    </g>
    <g class="commit-node-1">
      <circle cx="880" cy="240" r="9" fill="#0e172a" stroke="#EC4899" stroke-width="3" filter="url(#subtleGlow)"/>
      <circle cx="880" cy="240" r="4" fill="#EC4899" />
    </g>
  </g>

  <!-- Floating Tech Pills / Indicators -->
  <g opacity="0.85">
    <!-- Git pill -->
    <rect x="80" y="270" width="105" height="34" rx="17" fill="#1e293b" stroke="#F05032" stroke-width="1.5"/>
    <text x="132" y="292" fill="#F8FAFC" text-anchor="middle" class="badge-text">⚡ Git VCS</text>
    
    <!-- TUIs pill -->
    <rect x="990" y="270" width="130" height="34" rx="17" fill="#1e293b" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="1055" y="292" fill="#F8FAFC" text-anchor="middle" class="badge-text">💻 Terminal TUIs</text>

    <!-- Forges pill -->
    <rect x="80" y="25" width="145" height="32" rx="16" fill="#1e293b" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="152" y="46" fill="#F8FAFC" text-anchor="middle" class="badge-text">🛡️ Self-Hosted Forges</text>

    <!-- Next-Gen pill -->
    <rect x="970" y="25" width="155" height="32" rx="16" fill="#1e293b" stroke="#EC4899" stroke-width="1.5"/>
    <text x="1047" y="46" fill="#F8FAFC" text-anchor="middle" class="badge-text">🚀 Semantic Diffing</text>
  </g>

  <!-- FOREGROUND: Content Card / Backdrop for pristine text readability -->
  <rect x="180" y="80" width="840" height="195" rx="20" fill="#0b1120" fill-opacity="0.8" stroke="#334155" stroke-width="1" />

  <!-- FOREGROUND TEXT (Always 100% visible, crisp and prominent) -->
  <g id="foreground-content">
    <!-- Super Title / Tag -->
    <text x="600" y="122" text-anchor="middle" fill="#38BDF8" class="badge-text" letter-spacing="2">
      ⚡ THE CURATED DEVELOPER DIRECTORY
    </text>

    <!-- Main Title -->
    <text x="600" y="172" text-anchor="middle" fill="url(#primaryGrad)" class="title-text" font-size="40" filter="url(#subtleGlow)">
      Awesome Git &amp; SCM Utilities
    </text>

    <!-- Subtitle / Meta -->
    <text x="600" y="212" text-anchor="middle" fill="#94A3B8" class="subtitle-text" font-size="16">
      Enterprise SaaS Platforms • Self-Hosted Git Forges • Terminal TUIs • Next-Gen Version Control
    </text>

    <text x="600" y="246" text-anchor="middle" fill="#64748B" class="subtitle-text" font-size="13">
      ⚡ High-Performance Developer Tooling, Rust &amp; Go Terminal Clients, and Structural Diff Engines
    </text>
  </g>

  <!-- Decorative Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
</svg>
